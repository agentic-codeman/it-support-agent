# Wenda Agent 全套容器化编排
# 使用: docker compose up -d
# 注意: 若宿主机已在本地跑 MySQL/Redis/Milvus/RustFS/Ollama，需先停掉，
#       否则下方对外端口（3306/6379/19530/9000/11434）会冲突。

# 后端服务公共配置（backend 共用）
x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  environment:
    # 覆盖 .env 中的 127.0.0.1 为容器服务名（environment 优先级高于 env_file）
    DATABASE_URL: mysql+pymysql://root:123456@mysql:3306/wenda_agent?charset=utf8mb4
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    MILVUS_URI: http://milvus:19530
    RESTFS_URL: http://rustfs:9000
    EMBEDDING_API_URL: http://ollama:11434/api/embed

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: wenda_agent
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Milvus 3.0 元数据存储
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.25
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - milvus_etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Milvus 3.0 内部对象存储（不对外，与 RustFS 的 9000 无冲突）
  milvus-minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    command: minio server /minio_data
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - milvus_minio_data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  milvus:
    image: milvusdb/milvus:v3.0.0
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 90s

  # 对象存储（RustFS，S3 兼容，密钥与 .env 保持一致）
  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data

  # 本地 Embedding 服务
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # 如需 GPU 加速取消注释（Windows 走 Docker Desktop + WSL2 GPU）
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # 一次性任务：等待 ollama 就绪后拉取 bge-m3 模型
  ollama-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command: "until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull bge-m3"
    depends_on:
      - ollama
    restart: "no"

  backend:
    <<: *backend
    ports:
      - "5000:5000"
    volumes:
      - backend_logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
      rustfs:
        condition: service_started
      ollama:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
  milvus_etcd_data:
  milvus_minio_data:
  milvus_data:
  rustfs_data:
  ollama_data:
  backend_logs:
